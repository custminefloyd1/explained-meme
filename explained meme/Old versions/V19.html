<script>
// V19 FIX - preserve old appearance, fix dual column bug
(function(){
  const origFetch = window.fetch;
  window.fetch = async function(...args){
    const res = await origFetch.apply(this, args);
    try {
      const url = args[0] ? args[0].toString() : "";
      if(url.includes("/rest/v1/memes") || url.includes("supabase.co")){
        const clone = res.clone();
        const text = await clone.text();
        if(text.trim().startsWith("[") || text.trim().startsWith("{")){
          let data;
          try { data = JSON.parse(text); } catch(e){ return res; }
          const fixRow = (row) => {
            if(row && typeof row === 'object'){
              if(row.image_uri && !row.image_url) row.image_url = row.image_uri;
              if(row.image_url && !row.image_uri) row.image_uri = row.image_url;
              // trim
              if(row.image_url) row.image_url = row.image_url.trim();
              if(row.image_uri) row.image_uri = row.image_uri.trim();
            }
          };
          if(Array.isArray(data)) data.forEach(fixRow);
          else fixRow(data);
          // return new response with fixed data
          return new Response(JSON.stringify(data), {
            status: res.status,
            statusText: res.statusText,
            headers: res.headers
          });
        }
      }
    } catch(e){ console.warn("fetch patch error", e); }
    return res;
  };
  console.log("[V18-fixed] fetch interceptor installed - handles image_uri/image_url");
})();
</script>

<body>

<div id="explained-upload" style="display:none;max-width:1200px;margin:0 auto;padding:20px 20px 0 20px;font-family:monospace;">
  <div id="admin-gate" style="border:1px solid #27272a;background:#09090b;border-radius:12px;padding:12px 16px;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
    <span style="font-size:11px;color:#a1a1aa;">Admin mode — only visible with <b style="color:#d4ff00;">?admin</b> in URL</span>
    <span style="font-size:10px;color:#52525b;">Ctrl+Shift+A to toggle • No more deploys after this, content is live from Supabase</span>
  </div>
  <div style="border:1px solid #27272a;background:rgba(24,24,27,0.5);border-radius:12px;padding:16px 20px;margin-bottom:20px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div style="font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#fff;">Add to Explained — Templates (REAL SCHEMA)</div>
      <div style="font-size:10px;color:#71717a;">Writes to public.memes as image_uri • tags=[meme]</div>
    </div>
    <div style="display:grid;grid-template-columns:220px 1fr;gap:16px;">
      <div id="drop-zone" style="position:relative;border:1px dashed #3f3f46;border-radius:8px;padding:12px;background:#09090b;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;">
        <input type="file" id="file-input" accept="image/*" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:10;">
        <div id="drop-text" style="text-align:center;pointer-events:none;z-index:1;">
          <div style="font-size:24px;margin-bottom:8px;">📁</div>
          <div style="font-size:11px;color:#a1a1aa;">Click or drag image here</div>
          <div style="margin-top:10px;display:inline-block;background:#27272a;padding:6px 14px;border-radius:6px;font-size:11px;color:#fff;border:1px solid #3f3f46;">Choose file</div>
        </div>
        <img id="preview" style="display:none;max-height:140px;max-width:100%;border-radius:6px;z-index:1;pointer-events:none;">
        <div id="file-info" style="display:none;font-size:10px;color:#a3e635;margin-top:8px;text-align:center;word-break:break-all;z-index:1;pointer-events:none;"></div>
        <button id="clear-file" type="button" style="display:none;position:absolute;top:6px;right:6px;z-index:20;background:rgba(0,0,0,0.7);color:#fff;border:1px solid #3f3f46;border-radius:50%;width:24px;height:24px;font-size:12px;cursor:pointer;">✕</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <input id="up-title" placeholder="Title (e.g. Sigma Grindset)" style="width:100%;height:36px;background:#09090b;border:1px solid #27272a;border-radius:6px;padding:0 12px;font-size:13px;color:#fff;outline:none;">
        <textarea id="up-meaning" placeholder="Meaning (what it actually means)" rows="2" style="width:100%;background:#09090b;border:1px solid #27272a;border-radius:6px;padding:8px 12px;font-size:13px;color:#fff;resize:vertical;outline:none;"></textarea>
        <div style="display:flex;gap:8px;">
          <input id="up-origin" placeholder="Origin (e.g. TikTok 2021)" style="flex:1;height:36px;background:#09090b;border:1px solid #27272a;border-radius:6px;padding:0 12px;font-size:13px;color:#fff;outline:none;">
          <input id="up-example" placeholder="Example: 'Only in Ohio...'" style="flex:1;height:36px;background:#09090b;border:1px solid #27272a;border-radius:6px;padding:0 12px;font-size:13px;color:#fff;outline:none;">
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <select id="up-tag" style="flex:1;height:36px;background:#09090b;border:1px solid #27272a;border-radius:6px;padding:0 12px;font-size:13px;color:#fff;outline:none;">
            <option value="reaction">reaction</option>
            <option value="wholesome">wholesome</option>
            <option value="cursed">cursed</option>
            <option value="meta">meta</option>
            <option value="format">format</option>
            <option value="political">political</option>
            <option value="absurdist">absurdist</option>
            <option value="meme" selected>meme (Explained)</option>
          </select>
          <div style="flex:1;font-size:10px;color:#52525b;">Tag = filter in EXPLAINED.</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:4px;">
          <button id="up-btn" type="button" style="height:38px;padding:0 18px;background:#d4ff00;color:#000;font-size:12px;font-weight:700;border-radius:6px;border:none;cursor:pointer;white-space:nowrap;">Add to Explained</button>
          <span id="up-msg" style="font-size:11px;color:#a1a1aa;word-break:break-word;"></span>
        </div>
        <div id="schema-help" style="font-size:10px;color:#f59e0b;margin-top:4px;display:none;line-height:1.4;"></div>
      </div>
    </div>
  </div>
</div>


  <div id="root"></div>

<script>
(function(){
  // Admin gate
  const uploadEl = document.getElementById('explained-upload');
  function isAdmin(){ const url=window.location.href; return url.includes('?admin')||url.includes('&admin')||url.includes('#admin')||localStorage.getItem('isAdmin')==='true'; }
  function checkAdmin(){ if(isAdmin()) uploadEl.style.display='block'; else uploadEl.style.display='none'; }
  checkAdmin();
  document.addEventListener('keydown', (e)=>{ if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='a'){ const cur=localStorage.getItem('isAdmin')==='true'; if(cur){localStorage.removeItem('isAdmin'); alert('Admin hidden'); uploadEl.style.display='none';} else {localStorage.setItem('isAdmin','true'); alert('Admin shown'); uploadEl.style.display='block';} } });
})();

(function(){
  let selectedFile = null;
  const fileInput = document.getElementById('file-input');
  const dropZone = document.getElementById('drop-zone');
  const preview = document.getElementById('preview');
  const fileInfo = document.getElementById('file-info');
  const dropText = document.getElementById('drop-text');
  const clearBtn = document.getElementById('clear-file');
  const msgEl = document.getElementById('up-msg');
  
  function showPreview(file){
    selectedFile = file;
    const url = URL.createObjectURL(file);
    preview.src = url;
    preview.style.display = 'block';
    fileInfo.textContent = file.name + ' (' + Math.round(file.size/1024) + ' KB)';
    fileInfo.style.display = 'block';
    dropText.style.display = 'none';
    clearBtn.style.display = 'block';
    msgEl.textContent = 'Ready: ' + file.name;
    msgEl.style.color = '#a3e635';
  }
  
  function clearPreview(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    selectedFile = null;
    fileInput.value = '';
    preview.src = '';
    preview.style.display = 'none';
    fileInfo.style.display = 'none';
    dropText.style.display = 'block';
    clearBtn.style.display = 'none';
    msgEl.textContent = '';
  }
  
  clearBtn.addEventListener('click', clearPreview);
  fileInput.addEventListener('change', (e)=>{ const f=e.target.files&&e.target.files[0]; if(f) showPreview(f); });
  dropZone.addEventListener('dragover', (e)=>{ e.preventDefault(); dropZone.style.borderColor='#d4ff00'; dropZone.style.background='#1a1a0a'; });
  dropZone.addEventListener('dragleave', ()=>{ dropZone.style.borderColor='#3f3f46'; dropZone.style.background='#09090b'; });
  dropZone.addEventListener('drop', (e)=>{ e.preventDefault(); dropZone.style.borderColor='#3f3f46'; dropZone.style.background='#09090b'; const f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) showPreview(f); });
  
  document.getElementById('up-btn').addEventListener('click', async()=>{
    const title = document.getElementById('up-title').value.trim();
    const meaning = document.getElementById('up-meaning').value.trim();
    const origin = document.getElementById('up-origin').value.trim();
    const example = document.getElementById('up-example').value.trim();
    const tag = document.getElementById('up-tag').value;
    const helpEl = document.getElementById('schema-help');
    const btn = document.getElementById('up-btn');
    
    if(!selectedFile){ msgEl.textContent='❌ Click the box to select image'; msgEl.style.color='#ef4444'; return; }
    if(!title){ msgEl.textContent='❌ Need title'; msgEl.style.color='#ef4444'; return; }
    
    btn.disabled=true; btn.textContent='Uploading...'; msgEl.textContent='Uploading to Templates...'; msgEl.style.color='#a1a1aa'; helpEl.style.display='none';
    
    try{
      const kn='https://locumfwdacdrqgxputou.supabase.co';
      const be='sb_publishable_uaC5S2y8eCcCpvB8PZlwzg_m-ZUqyHR';
      const fileName=Date.now()+'-'+selectedFile.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      
      let upRes=await fetch(`${kn}/storage/v1/object/Templates/${fileName}`,{method:'POST',headers:{apikey:be,Authorization:`Bearer ${be}`,'x-upsert':'false'},body:selectedFile});
      if(!upRes.ok){ let t=await upRes.text(); throw new Error('Storage upload failed: '+t); }
      
      const imageUri=`${kn}/storage/v1/object/public/Templates/${fileName}`;
      msgEl.textContent='Creating row...';
      
      let existingCols=[];
      try{
        let r=await fetch(`${kn}/rest/v1/memes?select=*&limit=1`,{headers:{apikey:be,Authorization:`Bearer ${be}`}});
        if(r.ok){ let rows=await r.json(); if(rows.length>0) existingCols=Object.keys(rows[0]); }
      }catch(e){}
      
      // Build base data
      let baseData = {
        id: fileName,
        title: title,
        elo: 1200,
        avg_rating: 0,
        ratings_count: 0,
        wins: 0,
        losses: 0,
        tags: [tag, "meme"],
        is_user_submitted: true,
        meaning: meaning,
        origin: origin,
        example: example,
        image_uri: imageUri,
        image_url: imageUri, // V19 FIX: dual write
        storage_path: fileName,
        file_name: fileName
      };
      
      // Discover actual columns
      existingCols=[];
      try{
        let r=await fetch(`${kn}/rest/v1/memes?select=*&limit=1`,{headers:{apikey:be,Authorization:`Bearer ${be}`}});
        if(r.ok){ let rows=await r.json(); if(rows.length>0) existingCols=Object.keys(rows[0]); }
      }catch(e){}
      console.log('Existing cols from API:', existingCols);
      
      // Function to try insert with filtered payload
      async function tryInsert(payload){
        console.log('Trying payload:', Object.keys(payload));
        let res=await fetch(`${kn}/rest/v1/memes`,{method:'POST',headers:{apikey:be,Authorization:`Bearer ${be}`,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(payload)});
        let txt=await res.text();
        return {ok: res.ok, text: txt, res: res};
      }
      
      // Build payload with only columns that exist (or all if we couldn't detect)
      let payload={};
      for(let k in baseData){
        if(existingCols.length===0 || existingCols.includes(k)){
          payload[k]=baseData[k];
        }
      }
      // If we detected columns, also try common aliases for image
      if(existingCols.length>0){
        // Ensure at least one image column
        if(!payload['image_uri'] && !payload['image_url'] && !payload['storage_path'] && !payload['file_name']){
          // No image col detected, try all known image cols that exist
          if(existingCols.includes('image_uri')) payload['image_uri']=imageUri;
          else if(existingCols.includes('image_url')) payload['image_url']=imageUri;
          else if(existingCols.includes('storage_path')) payload['storage_path']=fileName;
          else if(existingCols.includes('file_name')) payload['file_name']=fileName;
        }
      }
      
      let result = await tryInsert(payload);
      
      // If failed due to missing column, auto-remove bad columns and retry (up to 10 times)
      let attempts=0;
      while(!result.ok && attempts<10){
        let m = result.text.match(/Could not find the '([^']+)' column/);
        if(!m) break;
        let badCol = m[1];
        console.log('Column not found in cache:', badCol, 'removing and retrying');
        
        if(payload.hasOwnProperty(badCol)){
          delete payload[badCol];
          // If badCol was image_uri, try image_url as fallback
          if(badCol==='image_uri' && (existingCols.length===0 || existingCols.includes('image_url'))){
            payload['image_url']=imageUri;
            console.log('Trying image_url fallback');
          } else if(badCol==='image_url' && (existingCols.length===0 || existingCols.includes('image_uri'))){
            payload['image_uri']=imageUri;
            console.log('Trying image_uri fallback');
          } else if((badCol==='image_uri' || badCol==='image_url') && existingCols.includes('storage_path')){
            payload['storage_path']=fileName;
          }
          
          result = await tryInsert(payload);
          attempts++;
        } else {
          // Bad col not in payload, but error says it's missing - try to find which col in payload is causing issue by removing one by one
          // Try removing meaning/origin/example first
          if(payload['meaning']){ delete payload['meaning']; result=await tryInsert(payload); attempts++; continue; }
          if(payload['origin']){ delete payload['origin']; result=await tryInsert(payload); attempts++; continue; }
          if(payload['example']){ delete payload['example']; result=await tryInsert(payload); attempts++; continue; }
          break;
        }
      }
      
      // Final fallback: absolute minimal payload that your screenshot shows MUST work
      if(!result.ok){
        console.log('All retries failed, trying absolute minimal');
        let minimalPayloads = [
          {id: fileName, title: title, image_uri: imageUri, image_url: imageUri, tags: [tag,"meme"]},
          {id: fileName, title: title, image_url: imageUri, image_uri: imageUri, tags: [tag,"meme"]},
          {id: fileName, title: title, image_uri: imageUri},
          {id: fileName, title: title, image_url: imageUri},
          {title: title, image_uri: imageUri, tags: [tag,"meme"]},
          {title: title, image_url: imageUri, tags: [tag,"meme"]},
          {id: fileName, title: title, elo: 1200}
        ];
        
        for(let mp of minimalPayloads){
          console.log('Trying minimal:', mp);
          result = await tryInsert(mp);
          if(result.ok) { payload=mp; break; }
        }
      }
      
      if(!result.ok){
        let t=result.text;
        if(t.includes('schema cache')){
          helpEl.style.display='block';
          helpEl.innerHTML='Schema cache stale. Run in SQL Editor:<br><code style="background:#18181b;padding:6px;display:block;margin-top:6px;">NOTIFY pgrst, \'reload schema\';</code>Then wait 30s and try again.<br><br>Also ensure these columns exist:<br><code style="background:#18181b;padding:6px;display:block;margin-top:6px;">ALTER TABLE public.memes ADD COLUMN IF NOT EXISTS meaning text;<br>ALTER TABLE public.memes ADD COLUMN IF NOT EXISTS origin text;<br>ALTER TABLE public.memes ADD COLUMN IF NOT EXISTS example text;<br>ALTER TABLE public.memes ADD COLUMN IF NOT EXISTS image_uri text;<br>ALTER TABLE public.memes ADD COLUMN IF NOT EXISTS image_url text;</code>Error: '+t;
        }
        if(t.includes('row-level security')||t.includes('policy')) throw new Error('RLS policy missing: '+t);
        throw new Error('DB insert failed after all retries: '+t+' | Tried: '+Object.keys(payload).join(',')+' | Existing cols API says: '+existingCols.join(','));
      }
      
      msgEl.textContent='✅ Added! Reloading...'; msgEl.style.color='#a3e635'; setTimeout(()=>location.reload(),1200);
    }catch(err){ msgEl.textContent='❌ '+err.message; msgEl.style.color='#ef4444'; btn.disabled=false; btn.textContent='Add to Explained'; console.error(err); }
  });
})();
</script>
